name: Tag a merged release

# The release-plan workflow opens a "Release vX.Y.Z" PR from release -> main once
# CHANGELOG.md/VERSION are bumped. Merging that PR IS the release; this tags the merge
# commit with the version VERSION now holds. notify-site.yml (triggered separately, by the
# push to main this merge produces) rebuilds the site from that tag.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity for the tag
        run: |
          git config user.name "repolane-release-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Tag main at VERSION
        run: |
          v=$(cat VERSION)
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "v$v already exists — not re-tagging"
            exit 0
          fi
          git tag -a "v$v" -m "v$v"
          git push origin "v$v"
