<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title id="pageTitle">lane-board</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;600&family=Roboto+Serif:opsz,wght@8..144,300;8..144,400&display=swap">
<link rel="stylesheet" href="/board.css">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <g id="g-branch" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="4.5" cy="3.5" r="1.75"/><circle cx="4.5" cy="12.5" r="1.75"/><circle cx="11.5" cy="5.5" r="1.75"/>
    <path d="M4.5 5.25v5.5M11.5 7.25c0 2.2-1.9 3.2-3.4 3.5-1.5.3-2.4.8-2.6 1.5"/></g>
  <g id="g-commit" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <circle cx="8" cy="8" r="2.6"/><path d="M1.5 8h3.9M10.6 8h3.9"/></g>
  <g id="g-push" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 13V4.6M4.6 8L8 4.4 11.4 8M3.2 2.4h9.6"/></g>
  <g id="g-pull" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3v8.4M4.6 8L8 11.6 11.4 8M3.2 13.6h9.6"/></g>
  <g id="g-diff" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.2 2.4v5.2M1.6 5h5.2M1.6 12.2h5.2M9.2 4.2h5.2M11.8 8.4v5.4M9.2 11.2h5.2"/></g>
  <g id="g-pr" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="4.2" cy="3.6" r="1.7"/><circle cx="4.2" cy="12.4" r="1.7"/><circle cx="11.8" cy="12.4" r="1.7"/>
    <path d="M4.2 5.3v5.4M11.8 10.7V6.4a2 2 0 00-2-2H7.4M9 2.6L7.2 4.4 9 6.2"/></g>
  <g id="g-check" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6.1"/><path d="M5.3 8.2l1.9 1.9 3.6-4"/></g>
  <g id="g-warn" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2.6l5.9 10.2H2.1L8 2.6zM8 6.6v3.1M8 11.6v.1"/></g>
  <g id="g-repo" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.4 2.4h7.4a1.6 1.6 0 011.6 1.6v9.6H4.6a1.6 1.6 0 01-1.6-1.6V2.4z"/><path d="M3 11.6h9.4"/></g>
  <g id="g-search" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <circle cx="7.2" cy="7.2" r="4.4"/><path d="M10.6 10.6l3 3"/></g>
  <g id="g-folder" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.9 4.2a1.3 1.3 0 011.3-1.3h2.7l1.4 1.8h5.5a1.3 1.3 0 011.3 1.3v6.1a1.3 1.3 0 01-1.3 1.3H3.2a1.3 1.3 0 01-1.3-1.3V4.2z"/></g>
  <g id="g-book" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.6 3.2A1.6 1.6 0 014.2 1.6H13v10.2H4.2a1.6 1.6 0 00-1.6 1.6V3.2zM2.6 13.4a1.6 1.6 0 011.6-1.6H13v2.6H4.2a1.6 1.6 0 01-1.6-1.6z"/></g>
  <g id="g-home" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.4 7L8 2.4 13.6 7v6.2a1 1 0 01-1 1H3.4a1 1 0 01-1-1V7z"/></g>
  <g id="g-dot" fill="currentColor"><circle cx="8" cy="8" r="3.4"/></g>
  <g id="g-play" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.6 2.9l8 5.1-8 5.1V2.9z"/></g>
  <g id="g-park" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.6" y="2.6" width="10.8" height="10.8" rx="2.4"/><path d="M6.4 5.8v4.4M9.6 5.8v4.4"/></g>
  <g id="g-flag" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.6 14V2.4M3.6 3.2h7.8l-1.4 2.6 1.4 2.6H3.6"/></g>
  <g id="g-plus" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M8 3.4v9.2M3.4 8h9.2"/></g>
  <g id="g-ext" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.4 2.6H13.4V6.6M13.4 2.6L7.6 8.4M11.4 9.6v2.9a1.4 1.4 0 01-1.4 1.4H3.9a1.4 1.4 0 01-1.4-1.4V6.4A1.4 1.4 0 013.9 5h2.9"/></g>
</defs></svg>

<body>
<div id="cmd">
  <span class="brand" id="homeBtn" tabindex="0" title="Home (esc)">lane-board</span>
  <select class="planeSel hidden" id="planeSel" title="Switch which registered control plane the board shows"></select>
  <span class="crumb" id="crumb"></span>
  <button class="switch" id="switchBtn" title="Jump to a lane or repo">
    <svg class="ic sm" viewBox="0 0 16 16"><use href="#g-search"/></svg>jump <kbd>&#8984;K</kbd></button>
  <button class="nav" id="memBtn" title="Memory: preferences, facts, per-repo notes (m)">
    <svg class="ic sm" viewBox="0 0 16 16"><use href="#g-book"/></svg>Memory <kbd>m</kbd></button>
  <button class="about hidden" id="aboutBtn" title="Goal, notes, references and conversations (i)">
    <svg class="ic sm" viewBox="0 0 16 16"><use href="#g-book"/></svg>About this work <kbd>i</kbd></button>
  <span class="sp"></span>
  <span id="chips"></span>
  <span id="cmdact"></span>
  <button class="iconbtn" id="theme" title="Theme"></button>
  <span class="clock" id="clock">&hellip;</span>
</div>

<!-- Home: the screen the app opens on, every restart -->
<section id="home" tabindex="0"></section>

<!-- Work: one lane, all its repos, its changes -->
<section id="work" class="hidden">
  <div id="repos"></div>
  <div id="prog"></div>
  <div id="split">
    <div id="filesCol">
      <div id="feeds">
        <button class="feed sel" data-feed="changes">Changes <b id="feedcount"></b></button>
        <button class="feed" data-feed="history">History</button>
      </div>
      <div id="scopebar" class="hidden">
        <button class="sc sel" data-scope="repo">This repo</button>
        <button class="sc" data-scope="lane">All repos</button>
      </div>
      <div id="fbar">
        <svg class="ic sm" viewBox="0 0 16 16"><use href="#g-search"/></svg>
        <input id="ffilter" type="search" placeholder="Filter files" autocomplete="off" spellcheck="false">
        <span id="fcount"></span>
      </div>
      <div id="files" tabindex="0"></div>
    </div>
    <div id="pane">
      <div id="stagehead"></div>
      <div id="pbody" tabindex="0"></div>
    </div>
  </div>
  <div id="commit" class="hidden">
    <textarea id="msg" rows="2" placeholder="Subject, then a blank line, then why" spellcheck="false"></textarea>
    <div class="row"><span id="mcount">0</span><span class="faint">keep the first line under 72</span><span class="sp"></span>
      <button class="txt" id="amendBtn" onclick="amendDlg()" title="Rewrite the last commit - refused once it is pushed">Amend last</button></div>
  </div>
  <div id="actbar">
    <span id="actwhy"></span><span class="sp"></span><span id="actbtns"></span>
  </div>
</section>

<!-- Memory: its own screen, scope first -->
<section id="memory" class="hidden">
  <nav id="mscopes"></nav>
  <div id="mfiles"></div>
  <div id="mbody"></div>
</section>

<div id="sheetwrap" class="hidden">
  <aside id="sheet" role="dialog" aria-label="About this lane">
    <div class="sh">
      <span id="sheetname"></span>
      <span class="sp"></span>
      <button class="iconbtn" id="sheetClose" title="Close (esc)">&times;</button>
    </div>
    <div id="stabs"></div>
    <div id="sheetbody"></div>
  </aside>
</div>
<div id="toasts"></div>
<dialog id="dlg"></dialog>
<div id="palwrap" class="hidden">
  <div id="pal" role="dialog" aria-label="Jump to a lane or repo">
    <div class="pin">
      <svg class="ic" viewBox="0 0 16 16"><use href="#g-search"/></svg>
      <input id="palq" type="text" placeholder="Jump to a lane or repo&hellip;" autocomplete="off" spellcheck="false">
      <span class="count" id="palcount"></span>
    </div>
    <div class="plist" id="pallist"></div>
    <div class="pfoot"><span><kbd>&uarr;&darr;</kbd> move</span><span><kbd>&crarr;</kbd> open</span>
      <span class="sp"></span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>
<script>window.__T='__TOKEN__'</script>
<script src="/board.js"></script>
</body></html>
